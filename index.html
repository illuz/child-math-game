<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>小马宝莉数学乐园</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>
    <div id="app">
        <!-- Main Menu Screen -->
        <div id="menu-screen" class="screen active">
            <div class="menu-container">
                <div class="user-panel" aria-live="polite">
                    <span class="user-label"><span id="current-avatar">🌈</span> 当前用户：<strong id="current-username">小朋友</strong></span>
                    <button class="user-switch-btn" id="switch-user" type="button">切换用户</button>
                </div>
                <h1 class="game-title">小马宝莉<br>数学乐园</h1>
                <div class="pony-decoration" id="menu-pony"></div>
                <div class="difficulty-buttons">
                    <button class="difficulty-btn easy" data-difficulty="easy">
                        <span class="star">⭐</span>
                        <span class="label">简单</span>
                        <span class="desc">1-5 轻松模式</span>
                    </button>
                    <button class="difficulty-btn medium" data-difficulty="medium">
                        <span class="star">⭐⭐</span>
                        <span class="label">中等</span>
                        <span class="desc">1-8 限时挑战</span>
                    </button>
                    <button class="difficulty-btn hard" data-difficulty="hard">
                        <span class="star">⭐⭐⭐</span>
                        <span class="label">困难</span>
                        <span class="desc">1-10 高手模式</span>
                    </button>
                    <button class="difficulty-btn infinite" data-difficulty="infinite">
                        <span class="star">♾️</span>
                        <span class="label">无限</span>
                        <span class="desc">1-10 无限畅玩</span>
                    </button>
                    <button class="difficulty-btn hell" data-difficulty="hell">
                        <span class="star">🔥🔥🔥</span>
                        <span class="label">地狱</span>
                        <span class="desc">1-30 极限挑战</span>
                    </button>
                </div>
                <button class="hanzi-btn" id="hanzi-game">
                    📖 认字乐园
                </button>
                <div class="visual-math-actions" aria-label="看图数学游戏">
                    <button class="visual-math-btn" id="visual-math-game" type="button">
                        🍎 看图数数
                    </button>
                    <button class="visual-math-btn visual-math-secondary" id="visual-count-10-game" type="button">
                        🔟 数到 10
                    </button>
                    <button class="visual-math-btn visual-math-secondary" id="visual-compare-game" type="button">
                        ⚖️ 比一比
                    </button>
                    <button class="visual-math-btn visual-math-secondary" id="visual-pattern-game" type="button">
                        🔷 找规律
                    </button>
                </div>
                <button class="collection-btn" id="view-collection">
                    🎴 我的卡片册
                </button>
                <button class="leaderboard-btn" id="view-leaderboard">
                    🏆 排行榜
                </button>
                <button class="parent-btn" id="view-parent-dashboard">
                    👪 家长中心
                </button>
            </div>
        </div>

        <!-- Hanzi Difficulty Screen -->
        <div id="hanzi-difficulty-screen" class="screen">
            <div class="menu-container">
                <button class="back-btn hanzi-back" id="back-from-hanzi-difficulty">🏠</button>
                <h1 class="game-title hanzi-title">认字乐园</h1>
                <div class="pony-decoration" id="hanzi-menu-pony"></div>
                <div class="difficulty-buttons">
                    <button class="difficulty-btn hanzi-easy" data-hanzi-difficulty="easy">
                        <span class="star">🌟</span>
                        <span class="label">简单</span>
                        <span class="desc">动物和食物</span>
                    </button>
                    <button class="difficulty-btn hanzi-medium" data-hanzi-difficulty="medium">
                        <span class="star">🌟🌟</span>
                        <span class="label">中等</span>
                        <span class="desc">自然和物品</span>
                    </button>
                    <button class="difficulty-btn hanzi-hard" data-hanzi-difficulty="hard">
                        <span class="star">🌟🌟🌟</span>
                        <span class="label">困难</span>
                        <span class="desc">全部类别</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Hanzi Game Screen -->
        <div id="hanzi-game-screen" class="screen">
            <div class="game-header">
                <button class="back-btn" id="back-from-hanzi-game">🏠</button>
                <div class="score-display">
                    <span class="score-icon">🌟</span>
                    <span id="hanzi-score">0</span>
                </div>
                <div class="timer-display" id="hanzi-timer-container">
                    <span class="timer-icon">⏱️</span>
                    <span id="hanzi-timer">--</span>
                </div>
                <div class="streak-display">
                    <span class="streak-icon">🔥</span>
                    <span id="hanzi-streak">0</span>
                </div>
            </div>

            <div class="game-area hanzi-game-area">
                <div class="pony-helper" id="hanzi-game-pony"></div>

                <div class="hanzi-question-container">
                    <div class="emoji-display" id="emoji-display">❓</div>
                    <div class="hint-text">这是什么？</div>
                </div>

                <div class="hanzi-answer-buttons" id="hanzi-answer-buttons">
                    <!-- Generated dynamically -->
                </div>

                <div class="progress-bar">
                    <div class="progress-fill" id="hanzi-progress-fill"></div>
                    <div class="progress-text">下一张卡片: <span id="hanzi-cards-progress">0</span>/<span id="hanzi-cards-needed">8</span></div>
                </div>
            </div>

            <div class="feedback-overlay" id="hanzi-feedback-overlay">
                <div class="feedback-content" id="hanzi-feedback-content"></div>
            </div>
        </div>

        <!-- Visual Math Game Screen -->
        <div id="visual-math-screen" class="screen">
            <div class="game-header">
                <button class="back-btn" id="back-from-visual-math" type="button">🏠</button>
                <div class="score-display"><span class="score-icon">🌟</span><span id="visual-score">0</span></div>
                <div class="streak-display"><span class="streak-icon">🔥</span><span id="visual-streak">0</span></div>
            </div>
            <div class="game-area visual-math-area">
                <div class="pony-helper" id="visual-game-pony"></div>
                <div class="visual-question-container">
                    <div class="visual-prompt" id="visual-prompt">有几个？</div>
                    <div class="visual-objects" id="visual-objects" aria-live="polite"></div>
                    <button class="hint-btn" id="visual-hint" type="button">💡 给我提示</button>
                    <div class="hint-message" id="visual-hint-message" aria-live="polite"></div>
                </div>
                <div class="visual-answer-buttons" id="visual-answer-buttons"></div>
                <div class="progress-bar">
                    <div class="progress-fill" id="visual-progress-fill"></div>
                    <div class="progress-text">本局进度：<span id="visual-progress">0</span>/<span id="visual-needed">5</span></div>
                </div>
            </div>
            <div class="feedback-overlay" id="visual-feedback-overlay">
                <div class="feedback-content" id="visual-feedback-content"></div>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen">
            <div class="game-header">
                <button class="back-btn" id="back-to-menu">🏠</button>
                <div class="score-display">
                    <span class="score-icon">🌟</span>
                    <span id="score">0</span>
                </div>
                <div class="timer-display" id="timer-container">
                    <span class="timer-icon">⏱️</span>
                    <span id="timer">--</span>
                </div>
                <div class="streak-display">
                    <span class="streak-icon">🔥</span>
                    <span id="streak">0</span>
                </div>
            </div>

            <div class="game-area">
                <div class="pony-helper" id="game-pony"></div>

                <div class="question-container">
                    <div class="question-card">
                        <span id="num1" class="number">?</span>
                        <span id="operator" class="operator">+</span>
                        <span id="num2" class="number">?</span>
                        <span class="equals">=</span>
                        <span id="answer-display" class="answer-box">?</span>
                    </div>
                </div>

                <div class="answer-buttons" id="answer-buttons">
                    <!-- Generated dynamically -->
                </div>

                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                    <div class="progress-text">下一张卡片: <span id="cards-progress">0</span>/<span id="cards-needed">2</span></div>
                </div>
            </div>

            <div class="feedback-overlay" id="feedback-overlay">
                <div class="feedback-content" id="feedback-content"></div>
            </div>
        </div>

        <!-- Collection Screen -->
        <div id="collection-screen" class="screen">
            <div class="collection-header">
                <button class="back-btn" id="back-from-collection">🏠</button>
                <h2>我的卡片册</h2>
                <span class="collection-count">已收集: <span id="collected-count">0</span>/<span id="total-cards">27</span></span>
            </div>
            <div class="collection-grid" id="collection-grid">
                <!-- Generated dynamically -->
            </div>
        </div>

        <!-- Leaderboard Screen -->
        <div id="leaderboard-screen" class="screen">
            <div class="collection-header leaderboard-header">
                <button class="back-btn" id="back-from-leaderboard">🏠</button>
                <div>
                    <h2>🏆 小马排行榜</h2>
                    <p>按累计答对题数排名</p>
                </div>
                <span class="leaderboard-no-password">无需密码</span>
            </div>
            <div class="leaderboard-list" id="leaderboard-list">
                <!-- Generated dynamically -->
            </div>
        </div>

        <!-- Parent Dashboard Screen -->
        <div id="parent-dashboard-screen" class="screen">
            <div class="collection-header">
                <button class="back-btn" id="back-from-parent-dashboard" type="button">🏠</button>
                <h2>家长中心</h2>
                <span class="collection-count" id="parent-sync-status">未验证</span>
            </div>
            <div class="parent-dashboard-content" id="parent-dashboard-content">
                <form class="parent-pin-form" id="parent-pin-form">
                    <h3 id="parent-pin-title">家长 PIN</h3>
                    <p id="parent-pin-help">首次使用请设置 4 位数字 PIN。</p>
                    <input id="parent-pin-input" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="4 位数字" required>
                    <input id="parent-current-pin-input" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="已有 PIN 时填写旧 PIN">
                    <button class="popup-btn" type="submit">进入家长中心</button>
                    <p class="parent-pin-error" id="parent-pin-error" aria-live="polite"></p>
                </form>
                <div class="parent-dashboard-data hidden" id="parent-dashboard-data"></div>
            </div>
        </div>

        <!-- Card Reward Popup -->
        <div id="card-popup" class="popup hidden">
            <div class="popup-content card-reward">
                <div class="sparkles"></div>
                <h2 id="card-reward-title">🎉 恭喜获得新卡片!</h2>
                <p id="card-reward-message" class="card-reward-message"></p>
                <div class="card-showcase" id="new-card-showcase"></div>
                <button class="popup-btn" id="close-card-popup">太棒了!</button>
            </div>
        </div>

        <!-- Wrong Answer Popup -->
        <div id="wrong-popup" class="popup hidden">
            <div class="popup-content wrong-answer">
                <div class="sad-pony-showcase" id="sad-pony-showcase"></div>
                <h2 class="wrong-title" id="wrong-title">😢 答错啦~</h2>
                <p class="wrong-message">没关系，继续加油！</p>
                <div class="correct-answer-box" id="correct-answer-box">
                    <span class="correct-label">正确答案是</span>
                    <span class="correct-number" id="correct-answer-display">0</span>
                </div>
                <button class="popup-btn wrong-btn" id="reveal-answer-btn" style="display: none;">👀 查看答案</button>
                <button class="popup-btn wrong-btn" id="close-wrong-popup">我知道了</button>
            </div>
        </div>

        <!-- User Switch Popup -->
        <div id="user-popup" class="popup hidden">
            <div class="popup-content user-switcher">
                <h2>👤 选择用户</h2>
                <p class="user-switch-hint" id="user-switch-status">无需密码，每位用户都有独立的卡片册和成绩。</p>
                <div class="user-list" id="user-list"></div>
                <div class="avatar-picker-section">
                    <div class="avatar-picker-title">选择头像</div>
                    <div class="avatar-options" id="avatar-options"></div>
                    <button class="popup-btn save-avatar-btn" id="save-avatar" type="button">保存当前头像</button>
                </div>
                <form class="new-user-form" id="new-user-form">
                    <label for="new-username">新建用户</label>
                    <div class="new-user-row">
                        <input id="new-username" name="username" type="text" maxlength="30" placeholder="输入名字" autocomplete="off" required>
                        <button class="popup-btn create-user-btn" type="submit">创建</button>
                    </div>
                </form>
                <button class="popup-btn user-cancel-btn" id="close-user-popup" type="button">取消</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
